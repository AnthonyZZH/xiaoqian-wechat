name: Offline tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest test_core test_runner test_memory_edit test_websearch test_routing test_agents test_agent_bridge test_proactive -v
        env:
          PYTHONDONTWRITEBYTECODE: '1'
